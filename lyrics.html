
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .deck { width: 100%; font-family: var(--font-sans); }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    min-height: 180px;
    background: #0d0d1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg-art {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 40%, #1a0a3a 0%, #0d0d1a 60%),
                radial-gradient(ellipse at 75% 70%, #0a1a3a 0%, transparent 60%);
    z-index: 0;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.35; z-index: 1; }
  .orb1 { width: 35%; height: 35%; background: #7c3aed; top: -10%; left: -10%; }
  .orb2 { width: 28%; height: 28%; background: #0ea5e9; bottom: -8%; right: -8%; }
  .orb3 { width: 20%; height: 20%; background: #ec4899; bottom: 20%; left: 20%; }

  .slide-content {
    position: relative; z-index: 2;
    text-align: center;
    padding: clamp(0.75rem, 3vw, 2rem) clamp(1rem, 5vw, 3rem);
    width: 100%;
  }
  .section-label {
    font-size: clamp(9px, 1.2vw, 11px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: clamp(0.4rem, 1.5vw, 1rem);
    font-weight: 500;
  }
  .lyric-text {
    font-size: clamp(12px, 2.2vw, 30px);
    color: #fff;
    line-height: 1.65;
    font-weight: 400;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    white-space: pre-line;
  }
  .lyric-text.visible { opacity: 1; transform: translateY(0); }

  .song-header {
    display: flex; align-items: center; gap: 10px;
    padding: clamp(0.5rem, 1.5vw, 0.85rem) clamp(0.75rem, 2vw, 1.25rem);
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .song-info { flex: 1; min-width: 0; }
  .song-title { font-size: clamp(12px, 1.8vw, 15px); font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-artist { font-size: clamp(10px, 1.4vw, 13px); color: var(--color-text-secondary); }
  .song-icon {
    width: clamp(28px, 4vw, 36px); height: clamp(28px, 4vw, 36px);
    border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #7c3aed, #0ea5e9);
    display: flex; align-items: center; justify-content: center;
  }
  .song-icon i { color: #fff; font-size: clamp(14px, 2vw, 18px); }

  .autoplay-btn {
    background: none; border: none; cursor: pointer;
    color: var(--color-text-secondary); font-size: clamp(11px, 1.4vw, 13px);
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; border-radius: var(--border-radius-md);
    flex-shrink: 0;
  }
  .autoplay-btn:hover { color: var(--color-text-primary); }
  .autoplay-btn.playing { color: #7c3aed; }

  .progress-bar { height: 2px; background: var(--color-border-tertiary); }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #0ea5e9);
    transition: width 0.3s ease;
  }

  .dots {
    display: flex; gap: 5px; align-items: center;
    flex-wrap: wrap; justify-content: center;
    padding: clamp(0.3rem, 1vw, 0.5rem) 1rem;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--color-border-secondary); cursor: pointer; transition: all 0.2s;
  }
  .dot.active { background: #7c3aed; width: 14px; border-radius: 3px; }

  .controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(0.4rem, 1.2vw, 0.75rem) clamp(0.75rem, 2vw, 1.25rem);
    border-top: 0.5px solid var(--color-border-tertiary);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: clamp(4px, 0.8vw, 6px) clamp(8px, 1.5vw, 14px);
    cursor: pointer; font-size: clamp(11px, 1.4vw, 13px);
    color: var(--color-text-secondary); transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .slide-counter { font-size: clamp(11px, 1.4vw, 13px); color: var(--color-text-secondary); }
  .slide-counter span { color: var(--color-text-primary); font-weight: 500; }
</style>

<div class="deck">
  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden;">

    <div class="song-header">
      <div class="song-icon"><i class="ti ti-music" aria-hidden="true"></i></div>
      <div class="song-info">
        <div class="song-title">Bohemian Rhapsody</div>
        <div class="song-artist">Queen · 1975</div>
      </div>
      <button class="autoplay-btn" id="autoBtn" onclick="toggleAuto()">
        <i class="ti ti-player-play" id="autoIcon"></i>
        <span id="autoLabel">Auto</span>
      </button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="stage">
      <div class="bg-art"></div>
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
      <div class="slide-content">
        <div class="section-label" id="sectionLabel"></div>
        <div class="lyric-text" id="lyricDisplay"></div>
      </div>
    </div>

    <div class="dots" id="dotsContainer"></div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn" onclick="go(-1)">
        <i class="ti ti-arrow-left" aria-hidden="true"></i> Prev
      </button>
      <div class="slide-counter"><span id="curSlide">1</span> / <span id="totalSlides">1</span></div>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">
        Next <i class="ti ti-arrow-right" aria-hidden="true"></i>
      </button>
    </div>

  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get("title").replaceAll(" ", "-");
  const artist = params.get("artist").replaceAll(" ", "-");

  console.log(title)
  console.log(artist)

  async function fetchLyrics() {
    const response = await fetch("https://api.lyrics.ovh/v1/" + artist + "/" + title, {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
      }
    });

    const data = await response.json();
    console.log(data)
    const lyrics = data.lyrics;
    console.log(lyrics)
    return lyrics
  }

  const songSlides = []
  const songLyrics = fetchLyrics().split("\n");
  for(sl of songLyrics){
    songSlides.push({
      section: title,
      text: sl
    })
  }

let cur = 0, autoTimer = null, isPlaying = false;
const lyricEl = document.getElementById('lyricDisplay');
const labelEl = document.getElementById('sectionLabel');
const curEl = document.getElementById('curSlide');
const totalEl = document.getElementById('totalSlides');
const dotsEl = document.getElementById('dotsContainer');
const progressEl = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

totalEl.textContent = slides.length;

function buildDots() {
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === cur ? ' active' : '');
    d.onclick = () => goto(i);
    dotsEl.appendChild(d);
  });
}

function showSlide(i) {
  lyricEl.classList.remove('visible');
  setTimeout(() => {
    labelEl.textContent = slides[i].section;
    lyricEl.textContent = slides[i].text;
    lyricEl.classList.add('visible');
  }, 180);
  curEl.textContent = i + 1;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === slides.length - 1;
  progressEl.style.width = ((i / (slides.length - 1)) * 100) + '%';
  buildDots();
}

function goto(i) { cur = Math.max(0, Math.min(slides.length - 1, i)); showSlide(cur); }
function go(dir) { goto(cur + dir); if (isPlaying && cur === slides.length - 1) stopAuto(); }

function toggleAuto() { isPlaying ? stopAuto() : startAuto(); }
function startAuto() {
  isPlaying = true;
  document.getElementById('autoIcon').className = 'ti ti-player-pause';
  document.getElementById('autoLabel').textContent = 'Pause';
  document.getElementById('autoBtn').classList.add('playing');
  autoTimer = setInterval(() => { cur < slides.length - 1 ? goto(cur + 1) : stopAuto(); }, 4000);
}
function stopAuto() {
  isPlaying = false; clearInterval(autoTimer);
  document.getElementById('autoIcon').className = 'ti ti-player-play';
  document.getElementById('autoLabel').textContent = 'Auto';
  document.getElementById('autoBtn').classList.remove('playing');
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

showSlide(0);
</script>
